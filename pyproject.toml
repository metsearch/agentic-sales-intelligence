[project]
name = "sales-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mouhamadou Ndiaye", email = "mouhamadou.ndiaye@audioptic.fr" }
]
requires-python = ">=3.14"
dependencies = [
    "db-dtypes>=1.9.0",
    "google-cloud-bigquery>=3.46.2",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[project.scripts]
sales-intelligence = "sales_intelligence:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
